<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Love Story ❤️</title>
<style>
body {
background: linear-gradient(135deg, #1e3c72, #2a5298, #1a2a6c);
font-family: 'Noto Sans Myanmar', sans-serif;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
overflow-x: hidden;
position: relative;
transition: background 1s ease;
}

/* ☁️ တိမ်တိုက်ပေါ်ရောက်နေသော နောက်ခံပုံစံနှင့် ရာသီဥတု ၄ မျိုး 🌤️🌧️💨❄️ */
.weather-container {
position: absolute;
width: 100%;
height: 100%;
top: 0;
left: 0;
pointer-events: none;
overflow: hidden;
z-index: 2;
opacity: 0;
transition: opacity 1.5s ease-in-out;
}

.weather-container.active {
opacity: 1;
}

#sunWeather {
background: linear-gradient(to bottom, #2980b9, #6dd5fa, #white);
}
.sun-element {
position: absolute;
top: 25px;
right: 35px;
font-size: 55px;
animation: rotateSun 20s linear infinite;
filter: drop-shadow(0 0 25px #ffeb3b);
}
@keyframes rotateSun {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
.cloud-white {
position: absolute;
font-size: 40px;
opacity: 0.85;
animation: floatCloud 15s linear infinite;
}
@keyframes floatCloud {
0% { transform: translateX(-50px); }
100% { transform: translateX(110vw); }
}

#rainWeather {
background: linear-gradient(to bottom, #34495e, #2c3e50, #1a252f);
}
.rain-cloud-dark {
position: absolute;
top: 20px;
font-size: 50px;
filter: drop-shadow(0 0 10px #222);
animation: floatCloud 12s linear infinite;
}
.raindrop {
position: absolute;
background: #00ffff;
width: 2px;
height: 18px;
opacity: 0.7;
animation: fallRain 0.5s linear infinite;
}
@keyframes fallRain {
0% { transform: translateY(0); }
100% { transform: translateY(100vh); }
}

#windWeather {
background: linear-gradient(to bottom, #4ca1af, #2c3e50);
}
.wind-cloud {
position: absolute;
font-size: 45px;
animation: blowWindCloud 6s linear infinite;
}
@keyframes blowWindCloud {
0% { transform: translateX(-100px) translateY(0); opacity: 0.2; }
50% { opacity: 1; }
100% { transform: translateX(110vw) translateY(30px); opacity: 0.2; }
}

#snowWeather {
background: linear-gradient(to bottom, #2c3e50, #bdc3c7, #2c3e50);
}
.snowflake {
position: absolute;
color: #ffffff;
font-size: 16px;
opacity: 0.8;
animation: fallSnow 3s linear infinite;
}
@keyframes fallSnow {
0% { transform: translateY(-20px) rotate(0deg); }
100% { transform: translateY(100vh) rotate(360deg); }
}

/* 💖 ကိုကိုက မီးမီးကို အသည်းပုံပေးခြင်း နှင့် မီးမီးက အာဘွားပစ်သည့် အန်နီမေးရှင်း */
.love-action-container {
position: absolute;
width: 100%;
height: 100%;
top: 0;
left: 0;
pointer-events: none;
z-index: 15;
overflow: hidden;
}

.flying-heart-boy {
position: absolute;
bottom: 250px;
left: 20%;
font-size: 32px;
opacity: 0;
animation: sendHeartFromBoy 4s ease-in-out infinite;
}
@keyframes sendHeartFromBoy {
0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
20% { opacity: 1; transform: translate(60px, -50px) scale(1.3); }
80% { opacity: 1; transform: translate(150px, -120px) scale(1); }
100% { transform: translate(220px, -170px) scale(0.2); opacity: 0; }
}

.flying-kiss-girl {
position: absolute;
bottom: 250px;
right: 20%;
font-size: 32px;
opacity: 0;
animation: sendKissFromGirl 4s ease-in-out infinite;
animation-delay: 2s;
}
@keyframes sendKissFromGirl {
0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
20% { opacity: 1; transform: translate(-60px, -50px) scale(1.3); }
80% { opacity: 1; transform: translate(-150px, -120px) scale(1); }
100% { transform: translate(-220px, -170px) scale(0.2); opacity: 0; }
}

.floating-container {
position: absolute;
width: 100%;
height: 100%;
top: 0;
left: 0;
pointer-events: none;
overflow: hidden;
z-index: 1;
}

.photo-wrapper {
position: absolute;
display: flex;
flex-direction: column;
align-items: center;
animation: glitchFadeMove 8s ease-in-out infinite alternate;
}

.floating-photo {
width: 90px;
height: 90px;
border-radius: 50%;
object-fit: cover;
user-select: none;
}

/* ဒုတိယစာမျက်နှာအတွက် ပုံအရွယ်အစားကို သေးငယ်စေရန် */
.game-active .floating-photo {
width: 55px;
height: 55px;
}

.photo-emoji {
font-size: 22px;
margin-bottom: 4px;
filter: drop-shadow(0 0 8px #fff);
}

.game-active .photo-emoji {
font-size: 15px;
margin-bottom: 2px;
}

@keyframes glitchFadeMove {
0% { opacity: 0.2; transform: translate(0, 0) scale(0.8); }
50% { opacity: 1; transform: translate(50px, -30px) scale(1.1); }
100% { opacity: 0.3; transform: translate(-40px, 40px) scale(0.9); }
}

.border-cyan { border: 3px solid #00ffff; box-shadow: 0 0 15px #00ffff; }
.border-yellow { border: 3px solid #ffcc00; box-shadow: 0 0 15px #ffcc00; }
.border-lime { border: 3px solid #39ff14; box-shadow: 0 0 15px #39ff14; }
.border-orange { border: 3px solid #ff6600; box-shadow: 0 0 15px #ff6600; }
.border-purple { border: 3px solid #bf00ff; box-shadow: 0 0 15px #bf00ff; }
.border-pink { border: 3px solid #ff007f; box-shadow: 0 0 15px #ff007f; }

.content-box {
text-align: center;
position: relative;
z-index: 20;
padding: 10px 15px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 12px;
width: 420px;
max-width: 95%;
box-sizing: border-box;
}

/* ✨ အပေါ်ဆုံးခေါင်းစဉ်စာသားအတွက် နီယွန်ဘောင်ဒီဇိုင်း (တစ်ကြောင်းတည်းဖြစ်အောင် ပြင်ပြီး) ✨ */
.main-title-box {
background: rgba(13, 27, 42, 0.75);
border: 2px solid #00ffff;
box-shadow: 0 0 15px rgba(0, 255, 255, 0.7), inset 0 0 10px rgba(0, 255, 255, 0.4);
padding: 10px 12px;
border-radius: 14px;
width: 100%;
box-sizing: border-box;
margin-bottom: 2px;
white-space: nowrap;
}

.main-title {
font-size: 21px;
font-weight: 900;
margin: 0;
background: linear-gradient(to bottom, #ffffff, #ffdf73, #ffa500);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
letter-spacing: 0.5px;
}

.love-quote {
font-size: 14px;
font-weight: 900;
margin: 6px 0 0 0;
background: linear-gradient(to bottom, #ffffff, #ffcc00, #ff6600);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.8));
white-space: nowrap;
}

.game-title {
font-size: 22px;
font-weight: 900;
margin-bottom: 10px;
background: linear-gradient(to bottom, #ffffff, #ffcc00);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
}

.control-box {
display: flex;
flex-direction: column;
gap: 8px;
width: 100%;
}

.primary-btn {
background: linear-gradient(45deg, #00ffff, #39ff14);
color: #0d1b2a;
border: none;
padding: 12px;
border-radius: 12px;
cursor: pointer;
font-size: 15px;
font-weight: 900;
box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 10px #39ff14;
transition: 0.2s;
width: 100%;
box-sizing: border-box;
}

.primary-btn:hover {
transform: scale(1.03);
}

.music-btn {
background-color: rgba(13, 27, 42, 0.8);
color: #00ffff;
border: 2px solid #00ffff;
padding: 8px;
border-radius: 10px;
cursor: pointer;
font-size: 13px;
font-weight: bold;
width: 100%;
box-sizing: border-box;
box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
}

/* ✨ မေးခွန်းစာသားအတွက် နီယွန်ဘောင်ဒီဇိုင်း ✨ */
.question-box {
font-size: 16px;
color: #ffffff;
background: rgba(13, 27, 42, 0.8);
border: 2px solid #ff007f;
box-shadow: 0 0 15px rgba(255, 0, 127, 0.8), inset 0 0 10px rgba(255, 0, 127, 0.4);
padding: 12px 15px;
border-radius: 14px;
margin-bottom: 15px;
min-height: 45px;
display: flex;
align-items: center;
justify-content: center;
width: 100%;
box-sizing: border-box;
font-weight: 900;
text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
text-align: center;
}

.choices-container {
display: flex;
justify-content: space-around;
margin-bottom: 10px;
width: 100%;
gap: 10px;
}

.choice-card {
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
}

.avatar-container {
position: relative;
width: 110px;
height: 175px;
display: flex;
flex-direction: column;
align-items: center;
}

.heart-head {
width: 95px;
height: 90px;
object-fit: cover;
clip-path: path('M47.5,85 C47.5,85 10,58 10,32 C10,15 21,7 34,7 C43,7 47.5,14 47.5,14 C47.5,14 52,7 61,7 C74,7 85,15 85,32 C85,58 47.5,85 47.5,85 Z');
padding: 3px;
box-sizing: border-box;
z-index: 2;
}

.cartoon-body-full {
position: absolute;
top: 78px;
width: 100px;
height: 90px;
z-index: 1;
}

.left-arm {
animation: danceLeftArm 0.6s ease-in-out infinite alternate;
transform-origin: 35px 12px;
}
.right-arm {
animation: danceRightArm 0.6s ease-in-out infinite alternate;
transform-origin: 65px 12px;
}
.left-leg {
animation: danceLeftLeg 0.6s ease-in-out infinite alternate;
transform-origin: 39px 52px;
}
.right-leg {
animation: danceRightLeg 0.6s ease-in-out infinite alternate;
transform-origin: 61px 52px;
}

@keyframes danceLeftArm {
0% { transform: rotate(0deg); }
100% { transform: rotate(-25deg) translateY(-3px); }
}
@keyframes danceRightArm {
0% { transform: rotate(0deg); }
100% { transform: rotate(25deg) translateY(-3px); }
}
@keyframes danceLeftLeg {
0% { transform: rotate(0deg); }
100% { transform: rotate(15deg); }
}
@keyframes danceRightLeg {
0% { transform: rotate(0deg); }
100% { transform: rotate(-15deg); }
}

/* ✨ ကိုကို/မီးမီး နာမည်စာသားများအတွက် နီယွန်ဘောင်ဒီဇိုင်း ✨ */
.choice-name-badge {
margin-top: 8px;
padding: 6px 12px;
background: rgba(13, 27, 42, 0.85);
border: 2px solid #00ffff;
border-radius: 12px;
box-shadow: 0 0 12px rgba(0, 255, 255, 0.7);
font-weight: 900;
font-size: 15px;
background: linear-gradient(to bottom, #ffffff, #ffcc00);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(0 0 8px rgba(255, 204, 0, 0.9));
}

.result-box {
font-size: 15px;
color: #ffffff;
font-weight: 900;
margin-bottom: 12px;
min-height: 25px;
text-shadow: 0 0 12px #00ffff;
}

.result-box.active {
background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 127, 0.1));
border: 1px solid rgba(0, 255, 255, 0.5);
padding: 10px;
border-radius: 12px;
}
</style>
</head>
<body>

<!-- 💖 ကိုကိုက မီးမီးကို အသည်းပုံပေးခြင်း နှင့် မီးမီး အာဘွားပစ်သည့် အန်နီမေးရှင်း -->

<path d="M34,4 L66,4 L74,48 C74,48 78,54 68,54 L32,54 C22,54 26,48 26,48 Z" fill="#ffffff" stroke="#ffdf73" stroke-width="2"/>
<polygon points="50,15 58,15 54,42" fill="#ff007f"/>
<g class="right-leg"><line x1="61" y1="54" x2="61" y2="74" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><ellipse cx="61" cy="78" rx="7" ry="4.5" fill="#39ff14" stroke="#ffdf73" stroke-width="1.5"/></g>
<g class="left-leg"><line x1="39" y1="54" x2="39" y2="74" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><ellipse cx="39" cy="78" rx="7" ry="4.5" fill="#39ff14" stroke="#ffdf73" stroke-width="1.5"/></g>
</svg>
</div>
<div class="choice-name-badge">ကိုကို🐼 ❤️</div>
</div>

<div class="choice-card" onclick="selectChoice('girl')">
<div class="avatar-container">
<img src="https://i.ibb.co/Zzf9xfX1/IMG-7156.jpg" class="heart-head" style="box-shadow: 0 0 25px #ffdf73, 0 0 10px #ff007f; background: #ffdf73;">
<svg class="cartoon-body-full" viewBox="0 0 100 90">
<g class="right-arm"><line x1="65" y1="12" x2="86" y2="30" stroke="#ffdf73" stroke-width="4.5" stroke-linecap="round"/><circle cx="88" cy="32" r="4.5" fill="#ffffff"/></g>
<g class="left-arm"><line x1="35" y1="12" x2="14" y2="30" stroke="#ffdf73" stroke-width="4.5" stroke-linecap="round"/><circle cx="12" cy="32" r="4.5" fill="#ffffff"/></g>
<path d="M35,4 L65,4 C78,42 84,52 84,52 L16,52 C16,52 22,42 35,4 Z" fill="#ffdf73" stroke="#ff007f" stroke-width="2"/>
<circle cx="50" cy="24" r="3.5" fill="#ffffff"/>
<circle cx="50" cy="38" r="3.5" fill="#ffffff"/>
<g class="right-leg"><line x1="61" y1="52" x2="61" y2="74" stroke="#ffdf73" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="61" cy="78" rx="7" ry="4.5" fill="#ff007f" stroke="#ffffff" stroke-width="1.5"/></g>
<g class="left-leg"><line x1="39" y1="52" x2="39" y2="74" stroke="#ffdf73" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="39" cy="78" rx="7" ry="4.5" fill="#ff007f" stroke="#ffffff" stroke-width="1.5"/></g>
</svg>
</div>
<div class="choice-name-badge">မီးမီး 🐹🍓</div>
</div>
</div>

<div class="result-box" id="resultText"></div>
<button class="primary-btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">နောက်ထပ် မေးခွန်း ➡️</button>
</div>

<script>
const questions = [
"ဘယ်သူက အစားပိုစားလဲ? 🍕", "ဘယ်သူက အရင် စကြိုက်တာလဲ? 💕", "ဘယ်သူက ဒေါသပိုကြီးလဲ? 🦩",
"ဘယ်သူက အိပ်ရာထနောက်ကျလဲ? 😴", "ဘယ်သူက ဖုန်းကို ပိုစွဲလမ်းလဲ? 📱", "ဘယ်သူက စကားပိုပြောလဲ? 🗣️",
"ဘယ်သူက အချိုပိုကြိုက်လဲ? 🍰", "ဘယ်သူက အရင်အိပ်​ပျော်တာလဲ 😒", "ဘယ်သူက အိပ်ပိုရင်ကြာလဲ? 🥴",
"ဘယ်သူက ရုပ်ရှင်ကြည့်ရင်း အိပ်လဲ?🎬", "ဘယ်သူက ပိုဆိုးသွမ်းလဲ? 🐒", "ဘယ်သူက အဝတ်အစားရွေးတာ ပိုကြာလဲ? 👕",
"ဘယ်သူက ဓာတ်ပုံရိုက်ရင် ပိုပိုစိတတ်လဲ? 📸", "ဘယ်သူက ပိုပျင်းရိတတ်လဲ? 🛋️", "ဘယ်သူက ငွေစုတာ ပိုတော်လဲ? 💰",
"ဘယ်သူက လမ်းလျှောက်ရင်/ကားမောင်းရင် ပိုသတိထားလဲ? 🚗", "ဘယ်သူကစာပြန်နောက်ကျလဲ? ⏳", "ဘယ်သူက မျက်နှာငယ်ပြပြီး ချွဲတတ်လဲ? 🥺",
"ဘယ်သူက အစားအသောက် ရွေးတတ်လဲ? 🍔", "ဘယ်သူက ချက်ပြုတ်ရတာ ပိုဝါသနာပါလဲ? 🍳", "ဘယ်သူက သီချင်းဆိုရင် ပိုသံစဉ်လွဲတတ်လဲ? 🎤",
"ဘယ်သူက အိပ်မက်ဆိုးမက်ရင် အရင်လန့်နိုးတတ်လဲ? 🌙", "ဘယ်သူက ပိုအိပ်ရေးဝတတ်လဲ? 🛏️", "ဘယ်သူက အရာရာကို အရင်စတင်ပြောတတ်လဲ? 💬",
"ဘယ်သူက ရိုမန်းတစ်ဆန်လဲ? 🌹", "ဘယ်သူက ရယ်စရာမပြောဘဲ ကိုယ်တိုင် အရင်ရယ်တတ်လဲ? 😂", "ဘယ်သူက ခရီးသွားရင် ပစ္စည်းပိုဆောင်တတ်လဲ? 🧳",
"ဘယ်သူက ကော်ဖီ (သို့) လက်ဖက်ရည် ပိုသောက်လဲ? ☕", "ဘယ်သူကအပြစ်လုပ်ထားရင်မျက်နှာပျက်​နေတတ်လဲ? 🤭", "ဘယ်သူက ဒီကမ္ဘာပေါ်မှာ အချစ်ရဆုံးနဲ့ အပျော်ဆုံးဖြစ်စေမယ့်သူလဲ? ❤️"
];

let currentQuestionIndex = 0;
const welcomePage = document.getElementById('welcomePage');
const gamePage = document.getElementById('gamePage');
const questionText = document.getElementById('questionText');
const resultText = document.getElementById('resultText');
const nextBtn = document.getElementById('nextBtn');
const choicesContainer = document.getElementById('choicesContainer');
const floatingContainer = document.getElementById('floatingContainer');
const bgAudio = document.getElementById('bgAudio');
let isMusicPlaying = false;
let weatherInterval = null;

function startGame() {
bgAudio.play().catch(error => { console.log("Audio play blocked:", error); });
isMusicPlaying = true;
welcomePage.style.display = 'none';
gamePage.style.display = 'block';
floatingContainer.classList.add('game-active');
loadQuestion();
startWeatherCycle();
}

function startWeatherCycle() {
const weathers = ['sunWeather', 'rainWeather', 'windWeather', 'snowWeather'];
let currentIndex = 0;

weatherInterval = setInterval(() => {
document.querySelectorAll('.weather-container').forEach(el => el.classList.remove('active'));
currentIndex = (currentIndex + 1) % weathers.length;
document.getElementById(weathers[currentIndex]).classList.add('active');
}, 10000);
}

function loadQuestion() {
if (currentQuestionIndex < questions.length) {
questionText.innerText = questions[currentQuestionIndex];
resultText.innerText = "";
resultText.classList.remove("active");
choicesContainer.style.display = "flex";
nextBtn.style.display = "none";
} else {
questionText.innerText = "🎉 မေးခွန်း ၃၀ လုံး ကုန်သွားပါပြီ! နှစ်ယောက်သား အမြဲတမ်း ပျော်ရွှင်ကြပါစေနော် ❤️";
choicesContainer.style.display = 'none';
resultText.innerText = "";
resultText.classList.remove("active");
nextBtn.style.display = "none";
if(weatherInterval) clearInterval(weatherInterval);
}
}

function selectChoice(person) {
let name = (person === 'boy') ? "ကိုကို ❤️ (အသည်းလေး)" : "မီးမီး 💋 (အနမ်းလေး)";
let actionText = (person === 'boy') ? "ပေးလိုက်တဲ့ အသည်းလေးနဲ့ တောက်လျှပ်တောက်လျှပ် ချစ်ဖို့ကောင်းနေတာပဲ!" : "ပေးလိုက်တဲ့ အနမ်းလေးနဲ့ လုံးဝကို ချစ်စရာအသည်းယားစရာကြီးကွာ!";
resultText.innerHTML = `😘 ဟားဟား! "${name}" ဆိုတာ သေချာပေါ့ကွာ..<br>${actionText} 🥰`;
resultText.classList.add("active");
choicesContainer.style.display = 'none';
nextBtn.style.display = "block";
}

function nextQuestion() {
currentQuestionIndex++;
loadQuestion();
}

function toggleMusic() {
if (isMusicPlaying) { bgAudio.pause(); isMusicPlaying = false; }
else { bgAudio.play(); isMusicPlaying = true; }
}
</script>
</body>
</html>
