<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Love Story ❤️</title>
<style>
body {
    background: linear-gradient(135deg, #0d1b2a, #1b263b, #0d2137);
    font-family: 'Noto Sans Myanmar', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    position: relative;
}

/* ပျောက်ကြားပုံစံ ပေါ်လိုက်ပျောက်လိုက်နဲ့ နေရာပါရွေ့မယ့် ကွန်တိန်နာ */
.floating-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.photo-wrapper {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: glitchFadeMove 8s ease-in-out infinite alternate;
}

.floating-photo {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    object-fit: cover;
    user-select: none;
}

.photo-emoji {
    font-size: 20px;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 8px #00ffff);
}

@keyframes glitchFadeMove {
    0% { opacity: 0.2; transform: translate(0, 0) scale(0.8); }
    50% { opacity: 1; transform: translate(60px, -40px) scale(1.1); }
    100% { opacity: 0.3; transform: translate(-50px, 50px) scale(0.9); }
}

.border-cyan { border: 3px solid #00ffff; box-shadow: 0 0 15px #00ffff, inset 0 0 8px #00ffff; }
.border-yellow { border: 3px solid #ffcc00; box-shadow: 0 0 15px #ffcc00, inset 0 0 8px #ffcc00; }
.border-lime { border: 3px solid #39ff14; box-shadow: 0 0 15px #39ff14, inset 0 0 8px #39ff14; }
.border-orange { border: 3px solid #ff6600; box-shadow: 0 0 15px #ff6600, inset 0 0 8px #ff6600; }
.border-purple { border: 3px solid #bf00ff; box-shadow: 0 0 15px #bf00ff, inset 0 0 8px #bf00ff; }
.border-pink { border: 3px solid #ff007f; box-shadow: 0 0 15px #ff007f, inset 0 0 8px #ff007f; }

/* ကဒ်နောက်ခံဖျောက်ထားပြီး စာတန်းများနှင့် ခလုတ်များနေရာ (ဗဟိုချက်) */
.content-box {
    text-align: center;
    position: relative;
    z-index: 10;
    padding: 10px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 380px;
    max-width: 90%;
    box-sizing: border-box;
}

.main-title {
    color: #00ffff;
    font-size: 22px;
    font-weight: 900;
    margin: 0;
    text-shadow: 0 0 20px #00ffff, 0 0 10px #ffffff, 0 0 30px #00ffff;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.love-quote {
    color: #ffcc00;
    font-size: 15px;
    font-weight: 900;
    margin: 0 0 10px 0;
    text-shadow: 0 0 20px #ffcc00, 0 0 10px #ff6600, 0 0 30px #ffcc00;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.control-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
}

.primary-btn {
    background: linear-gradient(45deg, #00ffff, #39ff14);
    color: #0d1b2a;
    border: none;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 900;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 8px #39ff14;
    transition: 0.2s;
    width: 100%;
    box-sizing: border-box;
}

.primary-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 0 40px #00ffff, 0 0 20px #ffffff;
}

.music-btn {
    background-color: transparent;
    color: #00ffff;
    border: 2px solid #00ffff;
    padding: 6px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    transition: 0.2s;
}

.music-btn:hover {
    background: rgba(0, 255, 255, 0.1);
}

.game-title {
    color: #ffcc00;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: 900;
    text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
}

/* မေးခွန်းနေရာကို နောက်ခံအမည်းရောင် သေသပ်သည့်ဘောင်အပိတ်ပုံစံ ပြောင်းထားခြင်း */
.question-box {
    font-size: 16px;
    color: #ffffff;
    background: rgba(13, 27, 42, 0.95);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #00ffff;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    font-weight: bold;
}

.choices-container {
    display: flex;
    justify-content: space-around;
    margin-bottom: 12px;
    width: 100%;
}

.choice-card {
    cursor: pointer;
    transition: transform 0.2s;
}

.choice-card:hover {
    transform: scale(1.08);
}

.choice-card img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ffcc00;
    box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
}

.choice-card p {
    margin-top: 5px;
    font-weight: bold;
    color: #ffcc00;
    text-shadow: 0 0 8px rgba(255, 204, 0, 0.5);
}

/* အဖြေပေါ်လာတဲ့အခါမှ လုံးဝလန်းပြီး ရှင်းလင်းတောက်ပမယ့် နောက်ခံဘောင်နှင့် စာသားစတိုင် */
.result-box {
    font-size: 15px;
    color: #ffffff;
    font-weight: 900;
    margin-bottom: 15px;
    min-height: 25px;
    text-shadow: 0 0 12px #00ffff, 0 0 5px #ffffff;
    letter-spacing: 0.5px;
}

.result-box.active {
    background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(255, 0, 127, 0.15));
    border: 2px solid #00ffff;
    padding: 12px 15px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), inset 0 0 10px rgba(0, 255, 255, 0.3);
    animation: popIn 0.3s ease-out forwards;
}

@keyframes popIn {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<!-- Welcome Page -->
<div id="welcomePage" class="content-box">
<h1 class="main-title">💞မေးခွန်းလေးတွေ ဖြေရအောင်💭</h1>
<p class="love-quote">🍒💗 ယောက်ျားကိုလွမ်းတိုင်း ကြည့်နိုင်ဖို့ 🍇💞</p>

<div class="control-box">
<button class="primary-btn" onclick="startGame()">ဂိမ်းစရန်နှိပ်ပါ ပူတူးရေ 🎮</button>
<button class="music-btn" onclick="toggleMusic()">🎵 သီချင်း ဖွင့်/ပိတ်</button>
</div>
</div>

<!-- Game Page -->
<div id="gamePage" class="content-box" style="display: none;">
<h2 class="game-title">😜ဘယ်သူဖြစ်မယ်ထင်လဲ😝</h2>

<div class="question-box" id="questionText">
မေးခွန်း တင်ဆက်နေပါပြီ...
</div>

<div class="choices-container" id="choicesContainer">
<div class="choice-card" onclick="selectChoice('boy')">
<img src="https://i.ibb.co/mVhzGR0T/IMG-7744.jpg" alt="Boy">
<p>ကိုကို🐼</p>
</div>
<div class="choice-card" onclick="selectChoice('girl')">
<img src="https://i.ibb.co/Zzf9xfX1/IMG-7156.jpg" alt="Girl">
<p>မီးမီး🐹</p>
</div>
</div>

<div class="result-box" id="resultText"></div>

<button class="primary-btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">နောက်ထပ် မေးခွန်း ➡️</button>
</div>

<script>
const questions = [
"ဘယ်သူက အစားပိုစားလဲ? 🍕",
"ဘယ်သူက အရင် စကြိုက်တာလဲ? 💕",
"ဘယ်သူက ဒေါသပိုကြီးလဲ? 🦩",
"ဘယ်သူက အိပ်ရာထနောက်ကျလဲ? 😴",
"ဘယ်သူက ဖုန်းကို ပိုစွဲလမ်းလဲ? 📱",
"ဘယ်သူက စကားပိုပြောလဲ? 🗣️",
"ဘယ်သူက အချိုပိုကြိုက်လဲ? 🍰",
"ဘယ်သူက အရင်အိပ်​ပျော်တာလဲ 😒",
"ဘယ်သူက အိပ်ပိုရင်ကြာလဲ? 🥴",
"ဘယ်သူက ရုပ်ရှင်ကြည့်ရင်း အိပ်လဲ?🎬",
"ဘယ်သူက ပိုဆိုးသွမ်းလဲ? 🐒",
"ဘယ်သူက အဝတ်အစားရွေးတာ ပိုကြာလဲ? 👕",
"ဘယ်သူက ဓာတ်ပုံရိုက်ရင် ပိုပိုစိတတ်လဲ? 📸",
"ဘယ်သူက ပိုပျင်းရိတတ်လဲ? 🛋️",
"ဘယ်သူက ငွေစုတာ ပိုတော်လဲ? 💰",
"ဘယ်သူက လမ်းလျှောက်ရင်/ကားမောင်းရင် ပိုသတိထားလဲ? 🚗",
"ဘယ်သူကစာပြန်နောက်ကျလဲ? ⏳",
"ဘယ်သူက မျက်နှာငယ်ပြပြီး ချွဲတတ်လဲ? 🥺",
"ဘယ်သူက အစားအသောက် ရွေးတတ်လဲ? 🍔",
"ဘယ်သူက ချက်ပြုတ်ရတာ ပိုဝါသနာပါလဲ? 🍳",
"ဘယ်သူက သီချင်းဆိုရင် ပိုသံစဉ်လွဲတတ်လဲ? 🎤",
"ဘယ်သူက အိပ်မက်ဆိုးမက်ရင် အရင်လန့်နိုးတတ်လဲ? 🌙",
"ဘယ်သူက ပိုအိပ်ရေးဝတတ်လဲ? 🛏️",
"ဘယ်သူက အရာရာကို အရင်စတင်ပြောတတ်လဲ? 💬",
"ဘယ်သူက  ရိုမန်းတစ်ဆန်လဲ? 🌹",
"ဘယ်သူက ရယ်စရာမပြောဘဲ ကိုယ်တိုင် အရင်ရယ်တတ်လဲ? 😂",
"ဘယ်သူက ခရီးသွားရင် ပစ္စည်းပိုဆောင်တတ်လဲ? 🧳",
"ဘယ်သူက ကော်ဖီ (သို့) လက်ဖက်ရည် ပိုသောက်လဲ? ☕",
"ဘယ်သူကအပြစ်လုပ်ထားရင်မျက်နှာပျက်​နေတတ်လဲ? 🤭",
"ဘယ်သူက ဒီကမ္ဘာပေါ်မှာ အချစ်ရဆုံးနဲ့ အပျော်ဆုံးဖြစ်စေမယ့်သူလဲ? ❤️"
];

let currentQuestionIndex = 0;
const welcomePage = document.getElementById('welcomePage');
const gamePage = document.getElementById('gamePage');
const questionText = document.getElementById('questionText');
const resultText = document.getElementById('resultText');
const nextBtn = document.getElementById('nextBtn');
const choicesContainer = document.getElementById('choicesContainer');
const bgAudio = document.getElementById('bgAudio');
let isMusicPlaying = false;

function startGame() {
bgAudio.play().catch(error => {
console.log("Audio play blocked:", error);
});
isMusicPlaying = true;

welcomePage.style.display = 'none';
gamePage.style.display = 'block';
loadQuestion();
}

function loadQuestion() {
if (currentQuestionIndex < questions.length) {
questionText.innerText = questions[currentQuestionIndex];
resultText.innerText = "";
resultText.classList.remove("active");
choicesContainer.style.display = "flex";
nextBtn.style.display = "none";
} else {
questionText.innerText = "🎉 မေးခွန်း ၃၀ လုံး ကုန်သွားပါပြီ! နှစ်ယောက်သား အမြဲတမ်း ပျော်ရွှင်ကြပါစေနော် ❤️";
choicesContainer.style.display = 'none';
resultText.innerText = "";
resultText.classList.remove("active");
nextBtn.style.display = "none";
}
}

function selectChoice(person) {
let name = (person === 'boy') ? "ကိုကို" : "မီးမီး";
resultText.innerText = `😹 ဟားဟား! သေချာတာပေါ့ "${name}" ဆိုတာ လုံးဝသေချာတာပေါ့ကွာ! 😝`;
resultText.classList.add("active");
choicesContainer.style.display = 'none';
nextBtn.style.display = "block";
}

function nextQuestion() {
currentQuestionIndex++;
loadQuestion();
}

function toggleMusic() {
if (isMusicPlaying) {
bgAudio.pause();
isMusicPlaying = false;
} else {
bgAudio.play();
isMusicPlaying = true;
}
}
</script>
</body>
</html>
