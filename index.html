<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Love Story ❤️</title>
<style>
body {
    background: linear-gradient(135deg, #0d1b2a, #1b263b, #0d2137);
    font-family: 'Noto Sans Myanmar', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    position: relative;
    transition: background 0.5s ease;
}

body.room-active {
    background: linear-gradient(135deg, #2b091e, #4a1535, #1f0515);
    box-shadow: inset 0 0 100px rgba(255, 0, 127, 0.5);
}

.floating-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.photo-wrapper {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: glitchFadeMove 8s ease-in-out infinite alternate;
}

.floating-photo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    user-select: none;
}

.photo-emoji {
    font-size: 22px;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 8px #00ffff);
}

@keyframes glitchFadeMove {
    0% { opacity: 0.2; transform: translate(0, 0) scale(0.8); }
    50% { opacity: 1; transform: translate(50px, -30px) scale(1.1); }
    100% { opacity: 0.3; transform: translate(-40px, 40px) scale(0.9); }
}

.border-cyan { border: 3px solid #00ffff; box-shadow: 0 0 15px #00ffff, inset 0 0 8px #00ffff; }
.border-yellow { border: 3px solid #ffcc00; box-shadow: 0 0 15px #ffcc00, inset 0 0 8px #ffcc00; }
.border-lime { border: 3px solid #39ff14; box-shadow: 0 0 15px #39ff14, inset 0 0 8px #39ff14; }
.border-orange { border: 3px solid #ff6600; box-shadow: 0 0 15px #ff6600, inset 0 0 8px #ff6600; }
.border-purple { border: 3px solid #bf00ff; box-shadow: 0 0 15px #bf00ff, inset 0 0 8px #bf00ff; }
.border-pink { border: 3px solid #ff007f; box-shadow: 0 0 15px #ff007f, inset 0 0 8px #ff007f; }

.content-box {
    text-align: center;
    position: relative;
    z-index: 10;
    padding: 10px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 360px;
    max-width: 92%;
    box-sizing: border-box;
}

.main-title {
    color: #00ffff;
    font-size: 20px;
    font-weight: 900;
    margin: 0 0 2px 0;
    text-shadow: 0 0 20px #00ffff, 0 0 10px #ffffff;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.love-quote {
    color: #ffcc00;
    font-size: 14px;
    font-weight: 900;
    margin: 0 0 8px 0;
    text-shadow: 0 0 20px #ffcc00, 0 0 10px #ff6600;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.control-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
}

.primary-btn {
    background: linear-gradient(45deg, #00ffff, #39ff14);
    color: #0d1b2a;
    border: none;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 900;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 8px #39ff14;
    transition: 0.2s;
    width: 100%;
    box-sizing: border-box;
}

.primary-btn:hover {
    transform: scale(1.03);
}

.music-btn {
    background-color: transparent;
    color: #00ffff;
    border: 2px solid #00ffff;
    padding: 6px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
}

.game-title {
    color: #ffcc00;
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: 900;
    text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
}

.question-box {
    font-size: 15px;
    color: #ffffff;
    background: rgba(13, 27, 42, 0.95);
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #00ffff;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    font-weight: bold;
}

.choices-container {
    display: flex;
    justify-content: space-around;
    margin-bottom: 10px;
    width: 100%;
    gap: 10px;
}

.choice-card {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.avatar-container {
    position: relative;
    width: 110px;
    height: 175px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ခေါင်းက လုံးဝငြိမ်နေစေရန် (Head remains stable) */
.heart-head {
    width: 95px;
    height: 90px;
    object-fit: cover;
    clip-path: path('M47.5,85 C47.5,85 10,58 10,32 C10,15 21,7 34,7 C43,7 47.5,14 47.5,14 C47.5,14 52,7 61,7 C74,7 85,15 85,32 C85,58 47.5,85 47.5,85 Z');
    padding: 3px;
    box-sizing: border-box;
    z-index: 2;
}

.cartoon-body-full {
    position: absolute;
    top: 78px;
    width: 100px;
    height: 90px;
    z-index: 1;
}

/* လက်နှင့် ခြေထောက်များသာ သီးသန့် ကခုန်လှုပ်ရှားနေမည့် အန်နီမေးရှင်းများ */
.left-arm {
    animation: danceLeftArm 0.6s ease-in-out infinite alternate;
    transform-origin: 35px 12px;
}

.right-arm {
    animation: danceRightArm 0.6s ease-in-out infinite alternate;
    transform-origin: 65px 12px;
}

.left-leg {
    animation: danceLeftLeg 0.6s ease-in-out infinite alternate;
    transform-origin: 39px 52px;
}

.right-leg {
    animation: danceRightLeg 0.6s ease-in-out infinite alternate;
    transform-origin: 61px 52px;
}

@keyframes danceLeftArm {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-25deg) translateY(-3px); }
}

@keyframes danceRightArm {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(25deg) translateY(-3px); }
}

@keyframes danceLeftLeg {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(15deg); }
}

@keyframes danceRightLeg {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-15deg); }
}

.choice-card p {
    margin-top: 4px;
    font-weight: bold;
    color: #ffcc00;
    font-size: 14px;
    text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
}

.result-box {
    font-size: 14px;
    color: #ffffff;
    font-weight: 900;
    margin-bottom: 12px;
    min-height: 25px;
    text-shadow: 0 0 12px #00ffff;
}

.result-box.active {
    background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(255, 0, 127, 0.15));
    border: 2px solid #00ffff;
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
}
</style>

"ဘယ်သူက  ရိုမန်းတစ်ဆန်လဲ? 🌹", "ဘယ်သူက ရယ်စရာမပြောဘဲ ကိုယ်တိုင် အရင်ရယ်တတ်လဲ? 😂", "ဘယ်သူက ခရီးသွားရင် ပစ္စည်းပိုဆောင်တတ်လဲ? 🧳",
"ဘယ်သူက ကော်ဖီ (သို့) လက်ဖက်ရည် ပိုသောက်လဲ? ☕", "ဘယ်သူကအပြစ်လုပ်ထားရင်မျက်နှာပျက်​နေတတ်လဲ? 🤭", "ဘယ်သူက ဒီကမ္ဘာပေါ်မှာ အချစ်ရဆုံးနဲ့ အပျော်ဆုံးဖြစ်စေမယ့်သူလဲ? ❤️"
];

let currentQuestionIndex = 0;
const welcomePage = document.getElementById('welcomePage');
const gamePage = document.getElementById('gamePage');
const questionText = document.getElementById('questionText');
const resultText = document.getElementById('resultText');
const nextBtn = document.getElementById('nextBtn');
const choicesContainer = document.getElementById('choicesContainer');
const bgAudio = document.getElementById('bgAudio');
let isMusicPlaying = false;

function startGame() {
bgAudio.play().catch(error => { console.log("Audio play blocked:", error); });
isMusicPlaying = true;
welcomePage.style.display = 'none';
gamePage.style.display = 'block';
document.body.classList.add('room-active');
loadQuestion();
}

function loadQuestion() {
if (currentQuestionIndex < questions.length) {
questionText.innerText = questions[currentQuestionIndex];
resultText.innerText = "";
resultText.classList.remove("active");
choicesContainer.style.display = "flex";
nextBtn.style.display = "none";
} else {
questionText.innerText = "🎉 မေးခွန်း ၃၀ လုံး ကုန်သွားပါပြီ! နှစ်ယောက်သား အမြဲတမ်း ပျော်ရွှင်ကြပါစေနော် ❤️";
choicesContainer.style.display = 'none';
resultText.innerText = "";
resultText.classList.remove("active");
nextBtn.style.display = "none";
}
}

function selectChoice(person) {
let name = (person === 'boy') ? "ကိုကို" : "မီးမီး";
resultText.innerText = `😹 ဟားဟား! သေချာတာပေါ့ "${name}" ဆိုတာ လုံးဝသေချာတာပေါ့ကွာ! 😝`;
resultText.classList.add("active");
choicesContainer.style.display = 'none';
nextBtn.style.display = "block";
}

function nextQuestion() {
currentQuestionIndex++;
loadQuestion();
}

function toggleMusic() {
if (isMusicPlaying) { bgAudio.pause(); isMusicPlaying = false; }
else { bgAudio.play(); isMusicPlaying = true; }
}
</script>
</body>
